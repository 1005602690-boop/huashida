# ============================================================
# Decap CMS 配置（华仕达智能机械官网）
# 说明：
#   1. backend 使用 GitHub。请先把本仓库推送到 GitHub，
#      再将下面的 repo 改为 你的用户名/仓库名。
#   2. 在非 Netlify 静态托管（如 CloudStudio / EdgeOne / GitHub Pages）
#      上，GitHub 登录需要 OAuth 服务端；Netlify 自带该代理，最省心。
#      推荐：站点托管到 Netlify（从 GitHub 导入），/admin 即可直接登录。
#   3. 「媒体库」可上传图片与视频到 assets/uploads/，供图片/视频字段选用。
#   4. 「菜单管理」编辑顶部导航；「页面管理」可新增/编辑独立网页（支持插图、插视频）。
# ============================================================

backend:
  name: github
  repo: 1005602690-boop/huashida
  branch: master

locale: zh
publish_mode: simple

# 媒体库：图片与视频统一上传到 assets/uploads/（对应线上 /assets/uploads）
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
media_library:
  name: uploadcare

collections:
  # ---------------- 产品 ----------------
  - name: "products"
    label: "产品管理"
    files:
      - name: "products"
        label: "产品列表"
        file: "content/products.json"
        format: json
        fields:
          - name: "items"
            label: "产品"
            widget: "list"
            summary: "{{fields.name_zh}} / {{fields.name_en}}"
            fields:
              - name: "cat"
                label: "产品系列"
                widget: "select"
                options:
                  - { label: "高周波机械", value: "hf" }
                  - { label: "超声波设备", value: "ultrasonic" }
                  - { label: "自动化设备", value: "auto" }
                  - { label: "包装机械", value: "pack" }
                  - { label: "模具系列", value: "mold" }
              - { name: "name_zh", label: "名称（中文）", widget: "string" }
              - { name: "name_en", label: "名称（英文）", widget: "string" }
              - name: "image"
                label: "产品图片（可选，留空用系列默认图）"
                widget: "image"
                required: false
                hint: "从媒体库选择或上传；不填则使用对应系列的默认实景图。"
              - name: "video"
                label: "产品视频（可选）"
                widget: "file"
                required: false
                hint: "可上传 mp4 等短视频，留空则不显示。"
              - { name: "desc_zh", label: "描述（中文）", widget: "text" }
              - { name: "desc_en", label: "描述（英文）", widget: "text" }
              - name: "inquiry"
                label: "询盘标识"
                widget: "string"
                hint: "格式：中文名 | English Name（用于产品页询盘弹窗）"

  # ---------------- 新闻 ----------------
  - name: "news"
    label: "新闻管理"
    files:
      - name: "news"
        label: "新闻列表"
        file: "content/news.json"
        format: json
        fields:
          - name: "items"
            label: "新闻"
            widget: "list"
            summary: "{{fields.date}} · {{fields.title_zh}}"
            fields:
              - name: "cat"
                label: "分类"
                widget: "select"
                options:
                  - { label: "企业动态", value: "company" }
                  - { label: "行业趋势", value: "trend" }
                  - { label: "新品发布", value: "new" }
                  - { label: "展会信息", value: "expo" }
              - { name: "date", label: "日期", widget: "date" }
              - { name: "title_zh", label: "标题（中文）", widget: "string" }
              - { name: "title_en", label: "标题（英文）", widget: "string" }
              - { name: "summary_zh", label: "摘要（中文）", widget: "text" }
              - { name: "summary_en", label: "摘要（英文）", widget: "text" }
              - name: "image"
                label: "封面图（可选）"
                widget: "image"
                required: false

  # ---------------- 案例 ----------------
  - name: "cases"
    label: "案例管理"
    files:
      - name: "cases"
        label: "案例列表"
        file: "content/cases.json"
        format: json
        fields:
          - name: "items"
            label: "案例"
            widget: "list"
            summary: "{{fields.title_zh}}"
            fields:
              - name: "ind"
                label: "行业"
                widget: "select"
                options:
                  - { label: "塑胶", value: "plastic" }
                  - { label: "玩具", value: "toy" }
                  - { label: "电器", value: "appliance" }
                  - { label: "电子", value: "electronic" }
                  - { label: "五金", value: "hardware" }
                  - { label: "印刷", value: "print" }
              - { name: "ind_zh", label: "行业名（中文）", widget: "string", hint: "如：塑胶行业" }
              - { name: "ind_en", label: "行业名（英文）", widget: "string", hint: "如：Plastics" }
              - { name: "title_zh", label: "案例标题（中文）", widget: "string" }
              - { name: "title_en", label: "案例标题（英文）", widget: "string" }
              - name: "image"
                label: "现场图（可选）"
                widget: "image"
                required: false
              - name: "video"
                label: "现场视频（可选）"
                widget: "file"
                required: false
              - { name: "bg_zh", label: "客户背景（中文）", widget: "text" }
              - { name: "bg_en", label: "客户背景（英文）", widget: "text" }
              - { name: "sol_zh", label: "解决方案（中文）", widget: "text" }
              - { name: "sol_en", label: "解决方案（英文）", widget: "text" }
              - { name: "res_zh", label: "实施效果（中文）", widget: "text" }
              - { name: "res_en", label: "实施效果（英文）", widget: "text" }

  # ---------------- 菜单 ----------------
  - name: "menu"
    label: "菜单管理"
    files:
      - name: "menu"
        label: "顶部导航"
        file: "content/menu.json"
        format: json
        fields:
          - name: "items"
            label: "导航项（按顺序拖动调整）"
            widget: "list"
            summary: "{{fields.label_zh}}"
            fields:
              - { name: "label_zh", label: "名称（中文）", widget: "string" }
              - { name: "label_en", label: "名称（英文）", widget: "string" }
              - name: "url"
                label: "链接地址"
                widget: "string"
                hint: "站内页面如 index.html、products.html；新增的独立页用 page.html?p=页面文件名（不含.md）"

  # ---------------- 页面（可新增网页） ----------------
  - name: "pages"
    label: "页面管理"
    folder: "content/pages"
    slug: "{{slug}}"
    format: yaml-front-matter
    create: true
    fields:
      - { name: "title_zh", label: "标题（中文）", widget: "string" }
      - { name: "title_en", label: "标题（英文）", widget: "string" }
      - name: "body"
        label: "正文（支持插图片/视频、标题、列表、加粗）"
        widget: "markdown"
        hint: "使用工具栏可插入媒体库中的图片与视频；支持 # 标题、**加粗**、- 列表、[链接](url)。"

  # ---------------- 站点设置 ----------------
  - name: "settings"
    label: "站点设置"
    files:
      - name: "settings"
        label: "联系方式 / 公司信息"
        file: "content/settings.json"
        format: json
        fields:
          - { name: "company_zh", label: "公司名（中文）", widget: "string" }
          - { name: "company_en", label: "公司名（英文）", widget: "string" }
          - { name: "phone_luo", label: "罗先生电话", widget: "string" }
          - { name: "phone_sun", label: "孙小姐电话", widget: "string" }
          - { name: "email", label: "邮箱", widget: "string" }
          - { name: "address_zh", label: "地址（中文）", widget: "string" }
          - { name: "address_en", label: "地址（英文）", widget: "string" }
          - { name: "wechat_id", label: "微信号", widget: "string" }
          - name: "hero_image"
            label: "主页大图（Hero，留空用默认图）"
            widget: "image"
            required: false
            hint: "建议尺寸约 800×600，上传整机/车间/案例实景图；留空则用系统默认图。"
          - name: "cat_img_hf"
            label: "分类卡片图：高周波机械"
            widget: "image"
            required: false
            hint: "首页产品分类卡片背景图，建议横图。"
          - name: "cat_img_ultrasonic"
            label: "分类卡片图：超声波设备"
            widget: "image"
            required: false
          - name: "cat_img_auto"
            label: "分类卡片图：自动化设备"
            widget: "image"
            required: false
          - name: "cat_img_pack"
            label: "分类卡片图：包装机械"
            widget: "image"
            required: false
          - name: "cat_img_mold"
            label: "分类卡片图：模具系列"
            widget: "image"
            required: false
